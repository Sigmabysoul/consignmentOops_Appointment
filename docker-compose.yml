services:
  appointment:
    build:
      context: .
      dockerfile: Dockerfile
    image: appointment-app:latest
    container_name: appointment-app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET:-${AUTH_SECRET}}
      - APP_URL=${APP_URL:-https://appo.averretail.com}
      # Delhivery One B2B API (live quote + booking). Values are set in Coolify; listed here so they reach the container.
      - DELHIVERY_ENV=${DELHIVERY_ENV:-test}
      - DELHIVERY_USERNAME=${DELHIVERY_USERNAME:-}
      - DELHIVERY_PASSWORD=${DELHIVERY_PASSWORD:-}
      - DELHIVERY_WAREHOUSE_NAME=${DELHIVERY_WAREHOUSE_NAME:-}
      - DELHIVERY_SOURCE_PIN=${DELHIVERY_SOURCE_PIN:-700100}
      - DELHIVERY_BOOKING_ENABLED=${DELHIVERY_BOOKING_ENABLED:-false}
      - DELHIVERY_BASE_URL_TEST=${DELHIVERY_BASE_URL_TEST:-}
      - DELHIVERY_BASE_URL_PROD=${DELHIVERY_BASE_URL_PROD:-}
      # Shiprocket Cargo B2B API (live rates + booking)
      - SHIPROCKET_REFRESH_TOKEN=${SHIPROCKET_REFRESH_TOKEN:-}
      - SHIPROCKET_CLIENT_ID=${SHIPROCKET_CLIENT_ID:-}
      - SHIPROCKET_BASE_URL=${SHIPROCKET_BASE_URL:-}
      - SHIPROCKET_BOOKING_ENABLED=${SHIPROCKET_BOOKING_ENABLED:-false}
      - SHIPROCKET_SENDER_WAREHOUSE_NAME=${SHIPROCKET_SENDER_WAREHOUSE_NAME:-}
      - SHIPROCKET_SENDER_ADDRESS_LINE1=${SHIPROCKET_SENDER_ADDRESS_LINE1:-}
      - SHIPROCKET_SENDER_ADDRESS_LINE2=${SHIPROCKET_SENDER_ADDRESS_LINE2:-}
      - SHIPROCKET_SENDER_PINCODE=${SHIPROCKET_SENDER_PINCODE:-700100}
      - SHIPROCKET_SENDER_CITY=${SHIPROCKET_SENDER_CITY:-Kolkata}
      - SHIPROCKET_SENDER_STATE=${SHIPROCKET_SENDER_STATE:-West Bengal}
      - SHIPROCKET_SENDER_CONTACT_NAME=${SHIPROCKET_SENDER_CONTACT_NAME:-}
      - SHIPROCKET_SENDER_CONTACT_EMAIL=${SHIPROCKET_SENDER_CONTACT_EMAIL:-}
      - SHIPROCKET_SENDER_CONTACT_PHONE=${SHIPROCKET_SENDER_CONTACT_PHONE:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
